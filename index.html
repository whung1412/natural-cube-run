<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>方塊衝刺</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; color: #fff; }
        #ui-layer { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 15px; }
        #score-board { font-size: 22px; font-weight: bold; color: #ecf0f1; text-shadow: 0 2px 4px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 15px; }
        #score-board span { color: #f1c40f; }
        #mute-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        /* 能量條的外框：負責置中與定位 */
        #shield-timer {
            position: absolute;
            top: 30px;          /* 距離遊戲框頂部 30px */
            left: 50%;          /* 靠左 50% */
            transform: translateX(-50%); /* 往左修正自身寬度的一半，達成完美水平置中 */
            width: 300px;       /* 倒數條的總寬度 */
            height: 16px;       /* 倒數條的高度 */
            background: rgba(255, 255, 255, 0.1); /* 外框半透明底色 */
            border: 2px solid #00f2fe;
            border-radius: 10px;
            padding: 2px;
            display: none;      /* 預設隱藏 */
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            z-index: 10;
        }

        /* 實際倒數的內條：負責變短與發光 */
        #shield-bar {
            width: 100%;        /* 預設全滿 */
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe); /* 漂亮的青藍色漸層 */
            border-radius: 6px;
            box-shadow: 0 0 10px #00f2fe;
            transition: width 0.1s linear; /* 讓長度縮短時看起來更平滑絲滑 */
        }
        #game-container { position: relative; width: 1000px; height: 400px; background: linear-gradient(to bottom, #1a1c2e 0%, #2c3e50 70%, #34495e 100%); border: 4px solid #f1c40f; border-radius: 12px; overflow: hidden; }
        #game-container::before { content: ''; position: absolute; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px; top: 0; left: 0; }
        #player { position: absolute; left: 80px; bottom: 0; width: 40px; height: 80px; background: #3498db; border: 2px solid #fff; border-radius: 6px; box-shadow: 0 0 15px #3498db; transform-origin: bottom center; transition: transform 0.1s; }
        #player.jumping-shrink { transform: scaleY(0.5); background: #f1c40f; }
        #player.ducking { transform: scaleY(0.5); background: #e67e22; }
        #player.invincible { background: linear-gradient(45deg, #00f2fe, #4facfe, #00f2fe); animation: shieldGlow 0.5s linear infinite; }
        @keyframes shieldGlow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        #ground { position: absolute; bottom: 0; width: 100%; height: 4px; background: #f1c40f; }
        .obstacle { position: absolute; width: 40px; height: 40px; background: #e74c3c; border: 2px solid #fff; border-radius: 6px; }
        #controls { display: flex; gap: 25px; margin-top: 25px; width: 100%; max-width: 500px; }
        .btn { flex: 1; height: 70px; background-color: #2ecc71; color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; box-shadow: 0 6px #27ae60; cursor: pointer; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px #27ae60; }
        #btn-down { background-color: #e67e22; box-shadow: 0 6px #b15e16; }
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(10, 10, 15, 0.9); color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 30; text-align: center; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 500px; margin-top: 15px; }
        .option-btn { padding: 15px; background-color: #34495e; color: white; border: 2px solid #7f8c8d; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #start-screen { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 15, 25, 0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        .play-btn { width: 220px; height: 70px; background-color: #00f2fe; color: #111; border: none; border-radius: 50px; font-size: 24px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <audio id="bg-music" src="bgm.mp3" loop></audio>
    <div id="ui-layer">
        <div id="score-board">
            <div>得分: <span id="current-score">0</span> | 歷史最高分: <span id="high-score">0</span></div>
            <button id="mute-btn">🔊 音樂：開</button>
        </div>
    </div>
    <div id="game-container">
        <div id="start-screen">
            <h1 style="color: #f1c40f;">方塊衝刺挑戰賽</h1>
            <button class="play-btn" onclick="startGame()">▶ PLAY</button>
        </div>
        <div id="shield-timer">
            <div id="shield-bar"></div>
        </div>
        <div id="player"></div>
        <div id="ground"></div>
        <div id="quiz-modal" class="modal">
            <h2 id="modal-title">💥 答題復活 💥</h2>
            <p id="quiz-question"></p>
            <div class="options-container" id="quiz-options"></div>
        </div>
        <div id="gameover-modal" class="modal">
            <h2 style="color: #e74c3c;">Game Over</h2>
            <p>得分: <span id="final-score">0</span></p>
            <button style="width: 180px; height: 50px; font-size: 18px; background-color: #2ecc71; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #27ae60; margin-top: 15px;" onclick="location.reload()">重新載入</button>
        </div>
    </div>
    <div id="controls">
        <button id="btn-up" class="btn" onclick="jump()">▲ 跳躍</button>
        <button id="btn-down" class="btn">▼ 下蹲</button>
    </div>

    <script>
        // --- 1. 所有變數必須在最上方宣告 ---
        const player = document.getElementById('player');
        const container = document.getElementById('game-container');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const quizModal = document.getElementById('quiz-modal');
        const modalTitle = document.getElementById('modal-title');
        const gameoverModal = document.getElementById('gameover-modal');
        const quizQuestionEl = document.getElementById('quiz-question');
        const quizOptionsEl = document.getElementById('quiz-options');
        const finalScoreEl = document.getElementById('final-score');
        const shieldTimerEl = document.getElementById('shield-timer');
        const startScreen = document.getElementById('start-screen');
        const bgMusic = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');

        let isJumping = false;
        let isDucking = false;
        let gameStatus = 'menu'; 
        let score = 0;
        let highScore = localStorage.getItem('cube_high_score_final') || 0;
        let currentSpeed = 6;
        let penaltySpeed = 0; 
        let jumpVelocity = 0;
        let playerBottom = 0;
        let obstacles = [];
        let spawnTimer = 0;
        let isInvincible = false;
        let shieldTimeRemaining = 0;
        let lastMilestone = 0;
        let currentQuizType = 'revive';
        let reviveCount = 0; // 紀錄目前已經復活幾次
        let availableQuizzes = []; // 目前還可以抽的題目池

        const gravity = 0.7;
        const baseSpeed = 6;

        // --- 2. 題庫資料[cite: 1] ---
        // --- 2. 題庫資料（全新擴充水域與陸域生態系題庫） ---
        const quizBank = [
            { q: "你到過恆春半島的風吹沙嗎？那兒形成了類似哪一種生態系的景觀？", a: ["(A) 河口生態系", "(B) 草原生態系", "(C) 海洋生態系", "(D) 沙漠生態系"], correct: 3 },
            { q: "下列何者「不是」臺灣岩岸地區常見的生物？", a: ["(A) 海膽", "(B) 螃蟹", "(C) 水筆仔", "(D) 綠藻"], correct: 2 },
            { q: "廣大的海洋生態系中，最主要的生產者為下列何者？", a: ["(A) 魚類", "(B) 藻類", "(C) 蝦類", "(D) 貝類"], correct: 1 },
            { q: "下列哪一種生物，應該「不屬於」紅樹林群集裡的生物？", a: ["(A) 招潮蟹", "(B) 水筆仔", "(C) 小白鷺", "(D) 雉雞"], correct: 3 },
            { q: "亞馬遜河旁的森林生態系為低緯度近赤道的森林，它應該屬於哪一種生態系？", a: ["(A) 落葉林", "(B) 混合林", "(C) 熱帶雨林", "(D) 針葉林"], correct: 2 },
            { q: "「狐獴眼睛周圍呈黑色防強光，挖洞時會將耳朵閉起來防沙。」推測它適合生活在何處？", a: ["(A) 溪流生態系", "(B) 河口生態系", "(C) 森林生態系", "(D) 沙漠生態系"], correct: 3 },
            { q: "沙漠植物的開花和下列哪一個環境因子最有關聯？", a: ["(A) 土壤", "(B) 光線", "(C) 溫度", "(D) 雨水"], correct: 3 },
            { q: "皮卡丘來到一個有水筆仔、招潮蟹、鳥類和彈塗魚的地方，請問此處可能是哪裡？", a: ["(A) 擎天崗草原", "(B) 關渡濕地", "(C) 日月潭", "(D) 玉山"], correct: 1 },
            { q: "關於海洋生態系中「潮間帶」和「淺海」的敘述，以下何者正確？", a: ["(A) 藻礁、珊瑚礁海岸位於此處", "(B) 人們浮潛或潛水的沙灘在此區", "(C) 是海洋中生物相最豐富的部份", "(D) 以上皆正確"], correct: 3 },
            { q: "關於陸域生態系，下列哪一項敘述是正確的？", a: ["(A) 針葉林分布於高山或高緯度", "(B) 熱帶雨林的土壤營養最豐富", "(C) 溫帶落葉林少有營養存積", "(D) 雨林植物葉形小且森林稀疏"], correct: 0 },
            { q: "如果熱帶雨林為陸域中最穩定之生態系，依此推論，下列何項最「不合理」？", a: ["(A) 當地的食物網相當複雜", "(B) 生產者提供的總能量通常最多", "(C) 擁有比其他陸域更多階層的消費者", "(D) 每階層能量損耗約佚失90%"], correct: 2 },
            { q: "下列哪一個生態系的食物鏈起始點，主要是「死亡生物的屍體碎屑」？", a: ["(A) 湖泊生態系", "(B) 淺海生態系", "(C) 深海生態系", "(D) 雨林生態系"], correct: 2 },
            { q: "場景：「花豹捕捉到羚羊後爬上樹躲避獅子，但獅子仍爬上樹搶奪獵物。」通常發生在？", a: ["(A) 森林生態系", "(B) 草原生態系", "(C) 沙漠生態系", "(D) 河口生態系"], correct: 1 },
            { q: "下列各種不同的生態系與生產者的配對，何者有誤？", a: ["(A) 河口生態系——水筆仔", "(B) 海洋生態系——大型水生植物", "(C) 溪流生態系——藻類", "(D) 湖泊生態系——浮游藻類"], correct: 1 },
            { q: "有關熱帶雨林生態系的敘述，下列何者錯誤？", a: ["(A) 生物種類繁多", "(B) 雨林底層住了一群耐陰植物", "(C) 附生植物攀附在喬木枝幹", "(D) 樹木以針葉林為主"], correct: 3 },
            { q: "裸子植物（針葉樹）葉片呈針狀有助減少水分散失，多分布在何種地區？", a: ["(A) 寒冷乾燥的高海拔或高緯度區", "(B) 高溫多雨的熱帶低海拔區", "(C) 潮濕多鹽分的潮間帶區域", "(D) 四季如春的平原草地區域"], correct: 0 },
            { q: "關於陸域生態系的特徵，下列敘述何者正確？", a: ["(A) 低海拔森林以針葉林為主", "（B) 生物分布僅受雨量影響", "(C) 沙漠消費者以大型草食動物為主", "(D) 草原包含大型草食與敏捷肉食動物"], correct: 3 },
            { q: "下列何者「不屬於」森林生態系的特徵？", a: ["(A) 降雨量為陸域生態系中最多", "(B) 有蘚苔、蕨類等耐陰植物", "(C) 消費者以大型草食及肉食動物為主", "(D) 高海拔針葉樹，低海拔闊葉樹"], correct: 2 },
            { q: "下列有關生態系的自我調節與平衡敘述，何者正確？", a: ["(A) 相鄰兩生態系間一般不具連續性", "(B) 包含生物（生產/消費/分解）與無機環境", "(C) 食物網愈複雜，自我調節能力就愈小", "(D) 穩定的生態系中，生物間呈現靜態平衡"], correct: 1 },
            { q: "請問下列哪些是導致「河口生態系」中生產者種類較少的主要原因？", a: ["(A) 土壤缺氧、有機養分少", "(B) 消費者多、鹽度沒變化", "(C) 土壤缺氧、鹽度變化大", "(D) 有機養分少、環境終日炎熱"], correct: 2 },
            { q: "在橫渡撒哈拉沙漠的路途中，跑者林義傑可能會有何種見聞或感受？", a: ["(A) 蠍子、駱駝和跳鼠經常出沒", "(B) 蜥蜴體表缺乏角質層", "(C) 終日炎熱，日夜溫差極小", "(D) 地表的土質溼滑難行"], correct: 0 },
            { q: "蘚苔植物和蕨類植物等「耐溼、耐陰」植物，最適合生存於下列哪一種生態系？", a: ["(A) 海洋生態系", "(B) 森林生態系", "(C) 草原生態系", "(D) 沙漠生態系"], correct: 1 },
            { q: "在深海 200 公尺以下的區域找不到生產者，主要是受到何種環境因子的限制？", a: ["(A) 溫度太低", "(B) 鹽度太高", "(C) 壓力太大", "(D) 缺乏光線"], correct: 3 },
            { q: "河川下游挾帶大量有機養分與泥沙淤積，使得哪一個生態系具有「營養鹽極多」的特色？", a: ["(A) 草原生態系", "(B) 河口生態系", "(C) 大洋生態系", "(D) 沙漠生態系"], correct: 1 }
        ];

        highScoreEl.innerText = highScore;

        // --- 3. 遊戲函式定義 ---
        function startGame() {
            startScreen.style.display = 'none';
            gameStatus = 'playing';
            score = 0;
            penaltySpeed = 0;
            if (bgMusic.paused) {
                bgMusic.volume = 0.4;
                bgMusic.play().catch(e => console.log("Music blocked"));
            }
            requestAnimationFrame(update);
        }

        function jump() {
            if (!isJumping && !isDucking && gameStatus === 'playing') {
                isJumping = true;
                jumpVelocity = 12.5;
                player.classList.add('jumping-shrink');
            }
        }

        function startDuck() {
            if (!isJumping && gameStatus === 'playing' && !isDucking) {
                isDucking = true;
                player.classList.add('ducking');
            }
        }

        function endDuck() {
            isDucking = false;
            player.classList.remove('ducking');
        }

        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');

        // 1. 跳躍控制 (上)
        // 平板觸控：一碰到按鈕千分之一秒內立刻觸發
        btnUp.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 攔截預設行為，消除行動端 300ms 延遲
            jump();
        }, { passive: false });

        // 電腦滑鼠點擊相容
        btnUp.addEventListener('mousedown', (e) => {
            e.preventDefault();
            jump();
        });

        // 2. 下蹲控制 (下)
        // 手指壓下：立刻變色變矮
        btnDown.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDuck();
        }, { passive: false });

        // 手指離開：恢復兩格高
        btnDown.addEventListener('touchend', (e) => {
            e.preventDefault();
            endDuck();
        });

        // 手指不小心滑出按鈕邊界：一樣安全恢復原狀
        btnDown.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            endDuck();
        });

        // 電腦滑鼠點擊相容
        btnDown.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startDuck();
        });

        // 預防滑鼠在按鈕外放開時卡住
        window.addEventListener('mouseup', () => {
            if (gameStatus === 'playing') endDuck();
        });


        // 3. 電腦版鍵盤事件優化
        window.addEventListener('keydown', (e) => {
            // 支援 W、空白鍵、上方向鍵
            if (e.key === 'ArrowUp' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                e.preventDefault(); // 阻斷瀏覽器網頁往上滾動的預設行為
                jump();
            }
            // 支援 S、下方向鍵
            if (e.key === 'ArrowDown' || e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault(); // 阻斷網頁往下滾動
                startDuck();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowDown' || e.code === 'ArrowDown' || e.code === 'KeyS') {
                endDuck();
            }
        });

        function update() {
            if (gameStatus !== 'playing') return;

            score += 0.1;
            currentScoreEl.innerText = Math.floor(score);
            currentSpeed = baseSpeed + (score / 150) + penaltySpeed;

            if (Math.floor(score) > 0 && Math.floor(score) % 250 === 0 && Math.floor(score) !== lastMilestone) {
                lastMilestone = Math.floor(score);
                triggerQuiz('milestone');
                return;
            }

            // --- 【能量條倒數優化】讓中間的進度條跟著時間縮短 ---
            if (isInvincible) {
                shieldTimeRemaining -= 1/60;
                
                if (shieldTimeRemaining <= 0) {
                    isInvincible = false;
                    player.classList.remove('invincible');
                    shieldTimerEl.style.display = 'none';
                } else {
                    // 根據當前剩餘時間，決定大護盾(5秒)或小護盾(1.5秒)的縮短比例
                    let maxDuration = (currentQuizType === 'revive') ? 1.5 : 5.0;
                    let percentage = (shieldTimeRemaining / maxDuration) * 100;
                    
                    // 控制內層的進度條寬度
                    document.getElementById('shield-bar').style.width = percentage + '%';
                }
            }

            if (isJumping) {
                playerBottom += jumpVelocity;
                jumpVelocity -= gravity;
                if (jumpVelocity < -1) player.classList.remove('jumping-shrink');
                if (playerBottom <= 0) {
                    playerBottom = 0;
                    isJumping = false;
                    player.classList.remove('jumping-shrink');
                }
                player.style.bottom = playerBottom + 'px';
            }

            spawnTimer++;
            if (spawnTimer > Math.max(30, 80 - (currentSpeed * 2))) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let right = (parseFloat(obs.el.style.right) || 0) + currentSpeed;
                obs.el.style.right = right + 'px';
                let obsLeft = container.clientWidth - right - 40;

                if (obsLeft < -40) {
                    container.removeChild(obs.el);
                    obstacles.splice(i, 1);
                    continue;
                }

                // 當 X 軸重疊時 (玩家固定在 Left 80px ~ 120px)
                if (obsLeft < 120 && obsLeft + 40 > 80) {
                    // 1. 計算玩家當前的 Y 軸上下邊界
                    let isShrinked = isDucking || (isJumping && player.classList.contains('jumping-shrink'));
                    let pBottom = playerBottom;
                    let pTop = playerBottom + (isShrinked ? 40 : 80);

                    // 2. 動態抓取障礙物當前的實質 Y 軸上下邊界
                    let oBottom = parseFloat(obs.el.style.bottom) || 0;
                    let oHeight = parseFloat(obs.el.style.height) || 40; // 如果沒抓到高度，預設為一格高 (40px)
                    let oTop = oBottom + oHeight;

                    // 3. 【全新動態碰撞判定】
                    // 只要玩家的頭頂 (pTop) 高於障礙物底部 (oBottom)，
                    // 且玩家的腳底 (pBottom) 低於障礙物頂部 (oTop)，就是重疊碰撞！
                    let hit = (pTop > oBottom && pBottom < oTop);

                    if (hit) {
                        if (isInvincible) {
                            container.removeChild(obs.el);
                            obstacles.splice(i, 1);
                        } else {
                            triggerQuiz('revive');
                            return;
                        }
                    }
                }
            }
            requestAnimationFrame(update);
        }

        function spawnObstacle() {
            const obsEl = document.createElement('div');
            obsEl.className = 'obstacle';
            const type = Math.random() > 0.5 ? 'low' : 'high';
            
            if (type === 'low') {
                obsEl.style.bottom = '0px'; 
                obsEl.style.height = '40px'; // 地面障礙物維持 1 格高
            } else {
                // 【完美修正】空中障礙物移到更高的位置，並拉長高度
                obsEl.style.bottom = '55px';  // 讓它高高懸空
                obsEl.style.height = '70px';  // 拉長它，做成一道空中阻礙
            }
            
            obsEl.style.right = '-40px';
            container.appendChild(obsEl);
            obstacles.push({ el: obsEl, type: type });
        }

        function triggerQuiz(type) {
            // 如果是撞到障礙物，且復活次數已經達到 3 次，直接 Game Over
            if (type === 'revive' && reviveCount >= 3) {
                gameOver();
                return;
            }

            gameStatus = 'quiz';
            currentQuizType = type;
            quizModal.style.display = 'flex';
            const q = quizBank[Math.floor(Math.random() * quizBank.length)];
            quizQuestionEl.innerText = q.q;
            quizOptionsEl.innerHTML = '';
            
            // --- 【完美修正】根據不同類型，顯示完全不同的大標題與小標題 ---
            if (type === 'revive') {
                modalTitle.innerHTML = `💥 偵測到碰撞！請答題原地復活 💥<br><span style="font-size: 18px; color: #e74c3c; font-weight: normal;">(剩餘復活機會: ${3 - reviveCount} 次)</span>`;
            } else {
                // 250 分的抽考，顯示護盾提示，且絕對不會出現「復活次數」的字眼
                modalTitle.innerHTML = `🎓 課堂抽考！答對獲得護盾 🎓<br><span style="font-size: 18px; color: #2ecc71; font-weight: normal;">(答對獲得 5 秒防護罩，答錯速度會變快喔！)</span>`;
            }

            q.a.forEach((opt, idx) => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.innerText = opt;
                b.onclick = () => {
                    quizModal.style.display = 'none';
                    if (idx === q.correct) {
                        gameStatus = 'playing';
                        isInvincible = true;
                        
                        // 只有真正撞到且答對，才扣除復活額度
                        if (type === 'revive') {
                            reviveCount++;
                        }

                        shieldTimeRemaining = (type === 'revive' ? 1.5 : 5);
                        player.classList.add('invincible');
                        shieldTimerEl.style.display = 'block';
                        requestAnimationFrame(update);
                    } else {
                        if (type === 'revive') gameOver();
                        else { gameStatus = 'playing'; penaltySpeed += 2; requestAnimationFrame(update); }
                    }
                };
                quizOptionsEl.appendChild(b);
            });
        }

        function gameOver() {
            gameStatus = 'gameover';
            gameoverModal.style.display = 'flex';
            finalScoreEl.innerText = Math.floor(score);
            if (score > highScore) localStorage.setItem('cube_high_score_final', Math.floor(score));
        }

        muteBtn.onclick = () => {
            bgMusic.muted = !bgMusic.muted;
            muteBtn.innerText = bgMusic.muted ? "🔇 音樂：關" : "🔊 音樂：開";
        };
    </script>
</body>
</html>
